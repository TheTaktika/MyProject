<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${articleDto.title}">Статья</title>
    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .article-container { background: white; border-radius: 10px; padding: 30px; }
        .article-content { line-height: 1.6; white-space: pre-wrap; }
    </style>
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-9">

            <div class="article-container shadow-sm">

                <!-- РЕЖИМ ПРОСМОТРА -->
                <div th:if="${!isEditing}">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <span class="badge bg-primary mb-2" th:text="${articleDto.category.displayName}">Категория</span>
                            <h1 class="display-5 fw-bold" th:text="${articleDto.title}">Заголовок</h1>
                        </div>
                        <!-- Кнопка редактирования -->
                        <a th:if="${#authentication.name == articleDto.author.username}"
                           th:href="@{/articles/{id}/edit(id=${articleDto.id})}"
                           class="btn btn-outline-secondary btn-sm">Редактировать</a>
                    </div>

                    <div class="d-flex align-items-center text-muted mb-4">
                        <div class="bg-secondary rounded-circle me-2" style="width: 30px; height: 30px;"></div>
                        <span class="fw-bold me-3" th:text="${articleDto.author.username}">Автор</span>
                        <span th:text="${#temporals.format(articleDto.createdAt, 'dd.MM.yyyy HH:mm')}">Дата</span>
                    </div>
                    <hr>
                    <div class="article-content fs-5" th:text="${articleDto.description}">Текст</div>
                </div>

                <!-- РЕЖИМ РЕДАКТИРОВАНИЯ -->
                <div th:if="${isEditing && #authentication.name == articleDto.author.username}">
                    <h2 class="mb-4">Редактирование</h2>
                    <form th:action="@{/articles/{id}/update(id=${articleDto.id})}" th:object="${articleDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Заголовок</label>
                            <input type="text" class="form-control form-control-lg" th:field="*{title}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Категория</label>
                            <select class="form-select" th:field="*{category}">
                                <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.displayName}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Содержание</label>
                            <textarea class="form-control" rows="10" th:field="*{description}" required></textarea>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success px-4">Сохранить изменения</button>
                            <a th:href="@{/articles/{id}(id=${articleDto.id})}" class="btn btn-light border">Отмена</a>
                        </div>
                    </form>

                    <hr class="my-4">

                    <form th:if="${#authentication != null && #authentication.name == articleDto.author.username}"
                          th:action="@{/articles/{id}/delete(id=${articleDto.id})}"
                          method="post"
                          style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm"
                                onclick="return confirm('Вы уверены, что хотите удалить статью?')">
                            Удалить
                        </button>
                    </form>
                </div>

            </div>
            <!-- Блок комментариев -->
            <div th:if="${!isEditing}" class="mt-5 p-4 border-top">
                <h4>Комментарии (<span th:text="${comments.size()}">0</span>)</h4>
                <!-- Форма добавления (только для залогиненных) -->
                <div th:if="${#authorization.expression('isAuthenticated()')}" class="mb-4">
                    <form th:action="@{/articles/{id}/comments(id=${articleDto.id})}" th:object="${newComment}" method="post">
                        <div class="mb-2">
                            <textarea th:field="*{text}" class="form-control" rows="2" placeholder="Напишите комментарий..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm">Отправить</button>
                    </form>
                </div>
                <!-- Список комментариев -->
                <div th:each="comment : ${comments}" class="card mb-2 bg-light border-0">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between mb-1">
                            <strong th:text="${comment.author.username}">Автор</strong>
                            <!-- Форма удаления -->
                            <form th:if="${#authentication != null && #authentication.name == comment.author.username}"
                                  th:action="@{/articles/{id}/deleteComment(id=${articleDto.id})}"
                                  method="post">
                                <input type="hidden" name="commentId" th:value="${comment.id}">

                                <button type="submit" class="btn btn-link text-muted btn-sm p-0">удалить</button>
                            </form>
                        </div>
                        <p class="mb-0" th:text="${comment.text}">Текст комментария</p>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
