<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Результаты поиска</title>
    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">
    <div class="row">
        <div class="col-md-8">
            <!-- Заголовок поиска -->
            <div class="mb-4">
                <h2 th:if="${searchQuery != null && !searchQuery.isEmpty()}">
                    Результаты по запросу: <span class="text-primary" th:text="${searchQuery}">Запрос</span>
                </h2>
                <h2 th:unless="${searchQuery != null && !searchQuery.isEmpty()}">Лента публикаций</h2>

                <p class="text-muted" th:if="${articles.isEmpty()}">По вашему запросу ничего не найдено.</p>
                <p class="text-muted" th:unless="${articles.isEmpty()}"
                   th:text="'Найдено публикаций: ' + ${articles.size()}"></p>
            </div>

            <!-- Список найденных статей -->
            <div th:each="article : ${articles}" class="card mb-4">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <span class="badge bg-primary mb-2" th:text="${article.category.displayName}">Категория</span>
                        <small class="text-muted" th:text="${#temporals.format(article.createdAt, 'dd.MM.yyyy HH:mm')}">Дата</small>
                    </div>
                    <h3 class="card-title h4">
                        <a th:href="@{/articles/{id}(id=${article.id})}" th:text="${article.title}" class="text-decoration-none text-dark">Заголовок статьи</a>
                    </h3>
                    <p class="card-text text-secondary" th:text="${#strings.abbreviate(article.description, 150)}">Краткое описание...</p>
                    <div class="d-flex align-items-center mt-3">
                        <div class="bg-secondary rounded-circle me-2" style="width: 30px; height: 30px;"></div>
                        <span class="fw-bold" th:text="${article.author.username}">Автор</span>
                        <a th:href="@{/articles/{id}(id=${article.id})}" class="btn btn-link ms-auto text-decoration-none stretched-link">Читать далее →</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Боковая панель для поиска по фильтрам-->
        <div class="col-md-4">
            <div class="card p-3 bg-white border-0 shadow-sm">
                <h5>Фильтры</h5>
                <hr>
                <form th:action="@{/articles/filter}" method="get">

                    <!-- Фильтр по автору -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Автор</label>
                        <input type="text" name="author" class="form-control form-control-sm"
                               placeholder="Имя автора" th:value="${param.author}">
                    </div>

                    <!-- Период публикации (С и ПО) -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Период публикации</label>
                        <div class="d-flex flex-column gap-2">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text">С</span>
                                <input type="date" name="dateAfter" class="form-control" th:value="${param.dateAfter}">
                            </div>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text">По</span>
                                <input type="date" name="dateBefore" class="form-control" th:value="${param.dateBefore}">
                            </div>
                        </div>
                    </div>

                    <!-- Категория -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Категория</label>
                        <select name="category" class="form-select form-select-sm">
                            <option value="">Все категории</option>
                            <!-- ВАЖНО: убедитесь, что categories переданы в Model -->
                            <option th:each="cat : ${categories}"
                                    th:value="${cat}"
                                    th:text="${cat.displayName}"
                                    th:selected="${cat.name() == param.category}"></option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary btn-sm w-100">Применить фильтры</button>
                    <a href="/articles" class="btn btn-link btn-sm w-100 mt-1 text-decoration-none text-muted">Сбросить всё</a>
                </form>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
